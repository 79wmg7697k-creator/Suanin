   if(v==to){const r=[];for(let c=v;c!=from;c=prev.get(c))r.unshift(c);return r}
   nx.push(v)}
  fr=nx}
 return null}
cv.addEventListener('pointerdown',e=>{if(state=='over')return;const[x,y]=pt(e),s=nearStop(x,y);if(!s)return;
 if(mode){tap(s);ui();return}
 const l=L[sel],n=l.stops.length;
 if(!n||l.stops[n-1]==s.id)dr={li:sel,D:[s.node],x,y,sx:x,sy:y,m:0,first:false,rev:false};
 else if(l.stops[0]==s.id)dr={li:sel,D:[s.node],x,y,sx:x,sy:y,m:0,first:true,rev:false};
 else dr={li:sel,D:[s.node],x,y,sx:x,sy:y,m:0,first:false,rev:false,mid:s.id};
 cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!dr)return;const[x,y]=pt(e);dr.x=x;dr.y=y;
 if(!dr.m&&Math.hypot(x-dr.sx,y-dr.sy)>10)dr.m=1;
 if(!dr.m||dr.mid!==undefined)return;
 const l=L[dr.li];
 if(dr.first&&!dr.rev){l.seq.reverse();l.stops.reverse();dr.rev=true;rebuild(l)}
 const t=nearNode(x,y);if(t<0)return;
 const D=dr.D,last=D[D.length-1];
 if(t==last)return;
 if(D.length>1&&t==D[D.length-2]){D.pop();return}
 if(D.includes(t)||l.seq.includes(t))return;
 const p=bridge(last,t,D,l,4);if(p)p.forEach(v=>D.push(v))});
cv.addEventListener('pointerup',e=>{if(!dr)return;const d=dr;dr=null;if(state=='over')return;
 const l=L[d.li];
 // 노선 중간 정류장을 끌어내면 그 정류장만 취소 (도로는 그대로 남음)
 if(d.mid!==undefined){if(d.m){l.stops=l.stops.filter(id=>id!=d.mid);rebuild(l);fin(l)}ui();return}
 if(!d.m){const[x,y]=pt(e),s=nearStop(x,y);if(s)tap(s);ui();return}
 const D=d.D,last=D[D.length-1],endStop=st.find(s=>s.node==last);
 if(D.length>=2&&endStop){
  if(!l.seq.length){l.seq=D.slice();l.stops=stopIds(D)}
  else{l.seq=l.seq.concat(D.slice(1));l.stops=l.stops.concat(stopIds(D.slice(1)))}
  rebuild(l);fin(l)
 }else if(d.rev){l.seq.reverse();l.stops.reverse();rebuild(l)}
 ui()});
cv.addEventListener('pointercancel',()=>{if(dr&&dr.rev){const l=L[dr.li];l.seq.reverse();l.stops.reverse();rebuild(l)}dr=null;ui()});
function shp(x,y,a,r,fill,stroke,lw){cx.beginPath();if(a==0)cx.arc(x,y,r,0,7);else if(a==1)cx.rect(x-r,y-r,2*r,2*r);
 else{cx.moveTo(x,y-r*1.15);cx.lineTo(x+r*1.05,y+r*.8);cx.lineTo(x-r*1.05,y+r*.8);cx.closePath()}
 if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.lineWidth=lw;cx.strokeStyle=stroke;cx.stroke()}}
function trace(pts){cx.beginPath();pts.forEach((p,k)=>k?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]))}
function draw(){const w=cv.width/dp,h=cv.height/dp;cx.setTransform(dp,0,0,dp,0,0);cx.fillStyle=T.bg;cx.fillRect(0,0,w,h);
 cx.translate(ox,oy);cx.scale(sc,sc);cx.lineCap='round';cx.lineJoin='round';
 // 도로망
 cx.strokeStyle=T.road;cx.lineWidth=3;EG.forEach(e=>{trace(e.pts);cx.stroke()});

 L.forEach((l,li)=>{if(l.fwd.length<2)return;cx.strokeStyle=COL[li];cx.lineWidth=4.5;trace(l.fwd);cx.stroke()});
 // 교차점 표시 (여러 노선이 지나는 도로 교차점)
 xn.forEach((ls,nd)=>{if(ls.size>1){const q=N[nd];cx.beginPath();cx.arc(q.x,q.y,4.2,0,7);cx.fillStyle=T.bg;cx.fill();cx.strokeStyle=T.ink;cx.lineWidth=1.6;cx.stroke()}});
 // 드래그 중 미리보기
 if(dr&&dr.m&&dr.D.length){const D=dr.D,pts=[[N[D[0]].x,N[D[0]].y]];for(let k=1;k<D.length;k++)epts(D[k-1],D[k]).slice(1).forEach(p=>pts.push(p));pts.push([dr.x,dr.y]);
  cx.setLineDash([6,5]);cx.strokeStyle=COL[dr.li];cx.lineWidth=3.5;trace(pts);cx.stroke();cx.setLineDash([])}
 // 정류장
 st.forEach(s=>{const n=N[s.node],r=8+s.s*2.5;shp(n.x,n.y,s.a,r,T.card,T.ink,3);
  if(s.g>0){cx.beginPath();cx.arc(n.x,n.y,r+7,-1.57,-1.57+6.28*Math.min(1,s.g));cx.strokeStyle='#e5484d';cx.lineWidth=3;cx.stroke()}
  s.w.forEach((p,i)=>shp(n.x+r+6+(i%5)*7,n.y-r+(i/5|0)*7,p.t,2.8,i>=s.cap?'#e5484d':T.ink))});
 // 정류장 이름
 cx.font='8px system-ui,"Noto Sans KR",sans-serif';cx.textAlign='center';cx.textBaseline='top';
 st.forEach(s=>{if(!s.name)return;const n=N[s.node],r=8+s.s*2.5,nm=s.name.length>8?s.name.slice(0,7)+'…':s.name;
  cx.lineWidth=3;cx.strokeStyle=T.bg;cx.strokeText(nm,n.x,n.y+r+3);cx.fillStyle=T.ink;cx.fillText(nm,n.x,n.y+r+3)});
 // 버스
 L.forEach((l,li)=>l.stops.length>1&&l.len&&l.buses.forEach(b=>{const[x,y]=pos(l,b.d);cx.fillStyle=COL[li];cx.fillRect(x-9,y-6,18,12);
  cx.fillStyle='#fff';cx.font='bold 9px system-ui';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(b.p.length,x,y+.5)}))}
function size(){const r=$('#w').getBoundingClientRect();dp=devicePixelRatio||1;cv.width=r.width*dp;cv.height=r.height*dp;
 cv.style.width=r.width+'px';cv.style.height=r.height+'px';sc=Math.min(r.width/W,r.height/H);ox=(r.width-W*sc)/2;oy=(r.height-H*sc)/2}
function loop(now){const dt=Math.min(.05,(now-lt)/1000);lt=now;
 if(state=='play'){const d=dt*spd;tm+=d;spawn(d);L.forEach(l=>l.buses.forEach(b=>stepBus(b,d)));gauges(d);if(state=='play'&&tm>=180)endDay();if(state=='play')hud()}
 draw();requestAnimationFrame(loop)}
