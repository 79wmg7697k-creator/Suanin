<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지도 데이터 연결 테스트</title>
<style>
body{font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif;margin:0;padding:16px;background:#f2f3f0;color:#1f2328}
h3{margin:0 0 12px}
button{font:inherit;padding:10px 16px;border:0;border-radius:10px;background:#1f2328;color:#fff;font-weight:600}
pre{background:#fff;padding:12px;border-radius:10px;white-space:pre-wrap;word-break:break-all;font-size:13px;margin-top:12px}
</style></head><body>
<h3>봉선동 지도 데이터 연결 테스트 (진단)</h3>
<button id="go">다시 실행</button>
<pre id="log">대기 중</pre>
<script>
const L=document.getElementById('log');
const say=t=>{L.textContent+=(L.textContent?'\n':'')+t};
const SERVERS=[
 'https://overpass-api.de/api/interpreter',
 'https://overpass.kumi.systems/api/interpreter',
 'https://lz4.overpass-api.de/api/interpreter',
 'https://z.overpass-api.de/api/interpreter'
];
async function ov(url,ql,ms){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||30000);
 try{
  const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(ql),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:c.signal});
  if(!r.ok){const tx=(await r.text()).replace(/\s+/g,' ').slice(0,140);throw new Error('HTTP '+r.status+' '+tx)}
  return await r.json();
 }finally{clearTimeout(t)}
}
const errText=e=>(e&&e.name==='AbortError')?'시간 초과':((e&&e.name)||'Error')+': '+((e&&e.message)||e);
async function run(){
 L.textContent='';
 say('브라우저: '+navigator.userAgent.slice(0,90));
 say('\n1. 서버별 연결 확인 (아주 작은 요청)');
 let ok=null;
 for(const s of SERVERS){
  const t0=performance.now();
  try{
   await ov(s,'[out:json][timeout:10];node(1);out;',15000);
   say(`   ✅ ${s}  (${Math.round(performance.now()-t0)}ms)`);
   if(!ok) ok=s;
  }catch(e){
   say(`   ❌ ${s}\n      → ${errText(e)}`);
  }
 }
 if(!ok){
  say('\n모든 서버에서 실패했어요. 위 에러 문구를 그대로 알려 주세요.');
  return;
 }
 say('\n2. 봉선동 경계 찾기 ('+ok.replace('https://','').split('/')[0]+')');
 try{
  const j1=await ov(ok,'[out:json][timeout:25];rel["name"="봉선동"]["boundary"="administrative"](34.9,126.5,35.4,127.3);out bounds;',30000);
  const b=(j1.elements||[]).find(e=>e.bounds);
  if(!b) throw new Error('봉선동 경계를 찾지 못함 (검색 결과 '+(j1.elements||[]).length+'개)');
  const{minlat:S,minlon:W,maxlat:N,maxlon:E}=b.bounds;
  say(`   범위: 위도 ${S.toFixed(4)}~${N.toFixed(4)}, 경도 ${W.toFixed(4)}~${E.toFixed(4)}`);
  say('\n3. 도로·건물·버스정류장 요청');
  const j2=await ov(ok,`[out:json][timeout:30];(way["highway"](${S},${W},${N},${E});way["building"](${S},${W},${N},${E});node["highway"="bus_stop"](${S},${W},${N},${E}););out tags center;`,45000);
  let roads=0,bld=0,stops=0;
  j2.elements.forEach(e=>{const t=e.tags||{};if(t.highway==='bus_stop')stops++;else if(t.highway)roads++;else if(t.building)bld++});
  say(`   도로 ${roads}개 / 건물 ${bld}개 / 버스정류장 ${stops}개`);
  say('\n✅ 지도 데이터 받기 성공');
 }catch(e){
  say('   ❌ '+errText(e));
 }
}
document.getElementById('go').onclick=run;
run();
</script></body></html>
